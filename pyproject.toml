[project]
name = "dataset-manager"
version = "0.1.0"
description = "Chunk, archive and upload research datasets to S3"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "boto3==1.35.31",
    "certifi",
    "mip",
    "more-itertools",
    "natsort",
    "nutree",
    "questionary",
    "rich",
    "smart-open[s3]>=8.0.1",
    "types-boto3[s3]",
    "tyro",
]

[project.scripts]
dataset-manager = "dataset_manager.cli:main"
dm = "dataset_manager.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dataset_manager"]

[dependency-groups]
dev = ["mypy", "ruff"]

[tool.ruff]
line-length = 121
target-version = "py314"

[tool.mypy]
python_version = "3.14"
files = ["src"]

[[tool.mypy.overrides]]
module = ["mip", "mip.*"]
ignore_missing_imports = true
